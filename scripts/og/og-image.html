<!doctype html>
<!-- Sharing image (1200×630) for search engines and link previews. Rendered by make-og-image.mjs into
     public/og-image.png; it is never served as a page. Text and colours follow the dark theme of the site. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'DM Sans';
        src: url('/node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 1000;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 800;
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        src: url('/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2')
          format('woff2');
      }
      :root {
        --bg: #111211;
        --ink: #f4f2eb;
        --muted: #a3a49b;
        --accent: #ff6a3d;
        --line: rgba(244, 242, 235, 0.12);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(circle at 78% 38%, rgba(255, 106, 61, 0.1), transparent 46%),
          radial-gradient(rgba(244, 242, 235, 0.07) 1.2px, transparent 1.4px) 0 0 / 26px 26px,
          var(--bg);
        color: var(--ink);
        font-family: 'DM Sans', sans-serif;
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 70px;
        bottom: 64px;
        width: 620px;
        display: flex;
        flex-direction: column;
      }
      .eyebrow {
        font-family: 'JetBrains Mono', monospace;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .eyebrow::before {
        content: '';
        width: 34px;
        height: 2px;
        background: var(--accent);
      }
      h1 {
        margin-top: 34px;
        font-size: 88px;
        line-height: 0.98;
        font-weight: 650;
        letter-spacing: -0.035em;
      }
      h1 em {
        display: block;
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-weight: 400;
        font-size: 104px;
        letter-spacing: -0.01em;
        color: var(--accent);
      }
      .tagline {
        margin-top: 30px;
        font-size: 29px;
        line-height: 1.3;
        color: var(--muted);
        max-width: 560px;
      }
      .tagline b {
        color: var(--ink);
        font-weight: 500;
      }
      .footer {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        color: var(--ink);
      }
      .footer span {
        color: var(--muted);
      }
      .pulse {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 6px rgba(255, 106, 61, 0.18);
      }
      canvas {
        position: absolute;
        right: 26px;
        bottom: 0;
      }
      .frame {
        position: absolute;
        inset: 26px;
        border: 1px solid var(--line);
        border-radius: 22px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="frame"></div>
      <canvas id="portrait" width="540" height="616"></canvas>
      <div class="copy">
        <p class="eyebrow">Backend Developer · .NET / Azure</p>
        <h1>Diego Espina <em>Rodríguez</em></h1>
        <p class="tagline">APIs, SQL Server e integraciones que <b>aguantan la carga real.</b></p>
        <p class="footer">
          <i class="pulse"></i>diegoespinarodriguez.com <span>· Oviedo, Asturias</span>
        </p>
      </div>
    </div>
    <script>
      // Same data and dark-theme formula as src/components/DotPortrait.tsx: one pixel per dot,
      // red = darkness of the area, green = share of the cell that belongs to the person.
      const image = new Image();
      image.onload = async () => {
        await document.fonts.ready;
        const source = document.createElement('canvas');
        source.width = image.naturalWidth;
        source.height = image.naturalHeight;
        const sourceContext = source.getContext('2d');
        sourceContext.drawImage(image, 0, 0);
        const { data } = sourceContext.getImageData(0, 0, source.width, source.height);
        const canvas = document.getElementById('portrait');
        const context = canvas.getContext('2d');
        const pitch = canvas.width / source.width;
        const ink = new Path2D();
        const lit = new Path2D();
        // A band of accent dots, like the scan line that draws the portrait on the site.
        const band = (row, column) =>
          Math.abs(row - source.height * 0.64 - Math.sin(column * 0.21) * 1.6) < 1.1;
        for (let row = 0; row < source.height; row++)
          for (let column = 0; column < source.width; column++) {
            const index = (row * source.width + column) * 4;
            const share = data[index + 1] / 255;
            if (!share) continue;
            const tone = data[index] / 255;
            const accent = band(row, column);
            let radius = pitch * 0.52 * (0.12 + 0.88 * (1 - tone) ** 1.35) * (0.35 + 0.65 * share);
            if (accent) radius = Math.max(radius, pitch * 0.3);
            if (radius < 0.3) continue;
            const x = (column + 0.5) * pitch;
            const y = (row + 0.5) * pitch;
            const path = accent ? lit : ink;
            path.moveTo(x + radius, y);
            path.arc(x, y, radius, 0, Math.PI * 2);
          }
        context.fillStyle = '#f4f2eb';
        context.fill(ink);
        context.fillStyle = '#ff6a3d';
        context.fill(lit);
        document.body.dataset.ready = 'true';
      };
      image.src = '/src/assets/portrait-dots.png';
    </script>
  </body>
</html>
