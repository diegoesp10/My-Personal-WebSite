<!doctype html>
<!-- The language comes from the address (nginx.conf, $page_language); React keeps it in step when navigating. -->
<html lang='<!--# echo var="page_language" default="es" -->'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, canonical address, sharing image and schema.org data of the requested page. Nginx replaces
         the include with the tags that the API generates from the content (GET /api/seo/head, see nginx.conf). The
         block is the fallback when the API does not answer and what the Vite dev server shows; the frontend applies
         the metadata of each page when navigating (src/lib/seo.ts). -->
    <!--# block name="seo" -->
    <title>Diego Espina Rodríguez</title>
    <!--# endblock -->
    <!--# include virtual="/api/seo/head?path=$request_uri" stub="seo" -->
    <meta name="author" content="Diego Espina Rodríguez" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111211" media="(prefers-color-scheme: dark)" />
    <!-- Icons: favicon.ico and PNG in multiples of 48 px for search results (Google shows them from 48×48), SVG for
         modern browsers, Apple touch icon and manifest. Generated by scripts/icons/make-icons.mjs. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="icon" href="/favicon-192x192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Applies the saved theme before the first paint. External file: the CSP does not allow inline scripts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        Esta web necesita JavaScript. Puedes escribirme a diegoespinarodriguez@gmail.com o ver mi
        código en github.com/diegoesp10.
      </p>
      <p lang="en" style="padding: 0 24px 24px; font-family: system-ui, sans-serif">
        This website needs JavaScript. You can email me at diegoespinarodriguez@gmail.com or see my
        code at github.com/diegoesp10.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
