# Language of a page from its address (/es/..., /en/...), written into <html lang> by SSI (index.html).
map $request_uri $page_language {
    default es;
    ~^/en(/|$|\?) en;
}

# Language for the bare domain: English when the browser asks for it first, Spanish otherwise.
map $http_accept_language $preferred_language {
    default es;
    ~*^en en;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Relative Location headers: behind the tunnel the public scheme and port are not this server's.
    absolute_redirect off;
    client_max_body_size 9m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    # The API container (repository My-personal-Website-Back) joins the network diego-portfolio-net as "api".
    # Resolved on each request, so this container starts even while the API is not running yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portfolio_api http://api:8080;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Every page lives under its language (/es, /en). The bare domain opens the visitor's language.
    location = / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Vary Accept-Language always;
        add_header Cache-Control "no-store" always;
        return 302 /$preferred_language$is_args$args;
    }

    # Addresses from before the languages, already indexed: the same page in Spanish, permanently.
    location ~ ^/(proyectos|experiencia|github|visitas|sobre-mi|diario|contacto|legal|error)(/.*)?$ {
        include /etc/nginx/conf.d/security-headers.inc;
        return 301 /es$request_uri;
    }

    location = /api { return 404; }

    # Metadata of each page (title, description, canonical, sharing image, schema.org), generated by the API from the
    # content and included by SSI in the <head> of index.html. Internal: only reachable as that subrequest. The
    # conditional and compression headers of the page request are dropped, so the include never comes back as a
    # 304 or compressed.
    location = /api/seo/head {
        internal;
        proxy_pass $portfolio_api$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
    location ^~ /api/ {
        proxy_pass $portfolio_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /uploads { return 404; }
    location ^~ /uploads/ {
        proxy_pass $portfolio_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Generated by the API from the current projects and journal entries.
    location = /sitemap.xml {
        proxy_pass $portfolio_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Who to tell about a vulnerability (RFC 9116). Served as plain text from the build; the legacy address at the
    # root redirects to the well-known one. Missing files answer 404 instead of the page shell.
    location = /.well-known/security.txt {
        try_files $uri =404;
        default_type text/plain;
        charset utf-8;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location = /security.txt {
        include /etc/nginx/conf.d/security-headers.inc;
        return 301 /.well-known/security.txt;
    }
    # The rest of /.well-known/ is for machines: a missing file is a 404, never the page shell.
    location ^~ /.well-known/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Web app manifest with its own media type (it is not in the default Nginx list).
    location = /site.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html includes the metadata of the requested page; without the API it keeps its fallback block.
        # HTML and its per-response CSP nonce must not be stored in browser or CDN caches.
        ssi on;
        ssi_silent_errors on;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }
}
